# Rate limiting zones
limit_req_zone $binary_remote_addr zone=tiles_burst:10m   rate=30r/s;
limit_req_zone $binary_remote_addr zone=tiles_hourly:20m  rate=10r/m;

# Referer classification
map $http_referer $from_openmaps_fr {
    ~*^https?://(www\.)?openmaps\.fr  1;
    default                            0;
}

map $http_referer $blocked_referer {
    ~*^https?://maps\.refuges\.info   1;
    ~*^https?://tile\.openmaps\.fr    1;
    default                            0;
}

# UA classification
map $http_user_agent $blocked_ua {
    ~*Firefox/49\.0   1;
    ~^Mozilla/4\.0    1;
    default           0;
}

map $http_user_agent $generic_ua {
    ~*(Apache-HttpClient|flutter_map)  1;
    ~^Mozilla/5\.0$                    1;
    default                            0;
}

map $http_user_agent $blocked_mytrails {
    ~*okhttp  1;
    default   0;
}

map $http_user_agent $mozilla5_ua {
    ~^Mozilla/5\.0  1;
    default         0;
}


# Referer gpx.studio
map $http_referer $from_gpxstudio {
    ~*gpx.studio  1;
    default        0;
}
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tile.openmaps.fr maps.refuges.info;

    ssl_certificate     /etc/letsencrypt/live/tile.openmaps.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tile.openmaps.fr/privkey.pem;

    access_log /var/log/nginx/tile.openmaps.fr-access.log combined;
    error_log  /var/log/nginx/tile.openmaps.fr-error.log;

    # Tuiles de substitution servies directement depuis le disque
    location = /_denied/referer {
        internal;
        default_type image/png;
        add_header Access-Control-Allow-Origin "*";
        alias /home/sites/openmaps.fr/images/tile-access-denied-referer.png;
    }
    location = /_denied/useragent {
        internal;
        default_type image/png;
        add_header Access-Control-Allow-Origin "*";
        alias /home/sites/openmaps.fr/images/tile-access-denied-user-agent.png;
    }
    location = /_denied/limited {
        internal;
        default_type image/png;
        add_header Access-Control-Allow-Origin "*";
        alias /home/sites/openmaps.fr/images/tile-limited-access-useragent.png;
    }
    location = /_denied/mytrails {
        internal;
        default_type image/png;
        add_header Access-Control-Allow-Origin "*";
        alias /home/sites/openmaps.fr/images/tile-mytrails-blocked.png;
    }
    location = /_denied/highvolume {
        internal;
        default_type image/png;
        add_header Access-Control-Allow-Origin "*";
        alias /home/sites/openmaps.fr/images/tile-access-limited-high-volume.png;
    }

    location = /robots.txt {
        alias /home/sites/openmaps.fr/well-known-proxy/robots.txt;
    }

    # Zoom >= 19 non supporte par les cartes servies ici -> 404 immediat, sans solliciter Apache/tirex (evite de polluer les logs avec des bots mal codes)
    location ~ "^/[^/]+/(1[9]|[2-9][0-9])/[0-9]+/[0-9]+\.png$" {
        return 404;
    }

    location / {
        limit_req_status 429;
        limit_req zone=tiles_burst  burst=600  nodelay;
        limit_req zone=tiles_hourly burst=5000 nodelay;

        # UA bloqué → 403 direct
        if ($blocked_ua) { return 403; }

        # MyTrails (application payante) → tuile d'information
        if ($blocked_mytrails) {
            rewrite ^ /_denied/mytrails last;
        }

        # UA vide → tuile denied
        if ($http_user_agent = "") {
            rewrite ^ /_denied/useragent last;
        }

        # Referer bloqué → tuile denied
        if ($blocked_referer) {
            rewrite ^ /_denied/referer last;
        }

        # Referer openmaps.fr sans api_key valide → tuile denied
        set $openmaps_check $from_openmaps_fr;
        if ($arg_api_key = "74aa0a5d592ec80cb2bdb849225fbf5063490cc5beabf6de") {
            set $openmaps_check "";
        }
        if ($openmaps_check = "1") {
            rewrite ^ /_denied/referer last;
        }

        # UA générique : tuile d'avertissement sur ~1/20 requêtes (coords se terminant par [148])
        set $warn "";
        if ($generic_ua = "1") { set $warn "ua"; }
        if ($uri ~ "/[0-9]+/[0-9]*[148]/[0-9]*[148]\.png$") {
            set $warn "${warn}_match";
        }
        if ($warn = "ua_match") {
            rewrite ^ /_denied/limited last;
        }

        # Mozilla/5.0 sans referer : tuile denied sur ~1/20 requêtes
        set $warn_noref "";
        if ($mozilla5_ua = "1") { set $warn_noref "ua"; }
        if ($http_referer = "") { set $warn_noref "${warn_noref}_noref"; }
        if ($uri ~ "/[0-9]+/[0-9]*[148]/[0-9]*[148]\.png$") {
            set $warn_noref "${warn_noref}_match";
        }
        if ($warn_noref = "ua_noref_match") {
            rewrite ^ /_denied/referer last;
        }


        # gpx.studio : tuile haute-frequence sur ~1/20 requetes (coords X en [48], Y en [148] -> ~6%)
        set $gpxstudio_check "";
        if ($from_gpxstudio = "1") { set $gpxstudio_check "ref"; }
        if ($uri ~ "/[0-9]+/[0-9]*[48]/[0-9]*[148]\.png$") {
            set $gpxstudio_check "${gpxstudio_check}_match";
        }
        if ($gpxstudio_check = "ref_match") {
            rewrite ^ /_denied/highvolume last;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_hide_header Upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Headers "*";
    }
}

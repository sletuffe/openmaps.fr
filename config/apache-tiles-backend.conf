# Apache backend pour mod_tile - écoute uniquement sur localhost:8080
# SSL, protection et contrôle d'accès sont gérés par nginx en frontal

<VirtualHost 127.0.0.1:8080>
    ServerName tile.openmaps.fr
    CustomLog /dev/null combined
    ErrorLog  /var/log/apache2/tiles-backend-error.log

    AddDefaultCharset UTF-8

    ModTileRenderdSocketName /run/tirex/modtile.sock
    ModTileTileDir           /home/big-data/mod_tile

    # "hiking" est l'ancien nom connu partout sur Internet, conservé pour compatibilité
    AddTileConfig /hiking/          openhikingmap
    AddTileConfig /openhikingmap/   openhikingmap
    AddTileConfig /openhikingmap-dev/ openhikingmap-dev
    AddTileConfig /opentopomap/     opentopomap

    ModTileBulkMode             Off
    ModTileRequestTimeout       0
    ModTileMissingRequestTimeout 30
    ModTileMaxLoadOld           4

    # Durées de cache (en secondes)
    # 2592000 = 30 jours  /  259200 = 3 jours  /  86400 = 1 jour
    ModTileCacheDurationMax          2592000
    ModTileCacheDurationDirty        600
    ModTileCacheDurationMinimum      86400
    ModTileCacheDurationMediumZoom   14 259200
    ModTileCacheDurationLowZoom      9  2592000
    ModTileCacheLastModifiedFactor   0.20
</VirtualHost>

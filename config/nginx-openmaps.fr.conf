# Content negotiation: Accept-Language → legend file suffix
map $http_accept_language $legend_lang {
    default   en;
    ~*^fr     fr;
    ~*^de     de;
    ~*^es     es;
    ~*^it     it;
}

server {
    listen 80;
    listen [::]:80;
    server_name openmaps.fr www.openmaps.fr;
    return 301 https://openmaps.fr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openmaps.fr www.openmaps.fr;

    ssl_certificate     /etc/letsencrypt/live/openmaps.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openmaps.fr/privkey.pem;

    access_log /var/log/nginx/openmaps.fr-access.log combined;
    error_log  /var/log/nginx/openmaps.fr-error.log;

    root /home/sites/openmaps.fr;
    charset utf-8;

    # Short URLs (from .htaccess RewriteRules)
    location = /donate   { rewrite ^ /donate.html last; }
    location = /tup      { rewrite ^ /tile-usage-policy.html last; }
    location = /mytrails { return 302 https://github.com/sletuffe/openmaps.fr/discussions/4; }
    location = /favicon.ico { alias /home/sites/openmaps.fr/images/openmaps-logo-icon-square-32x32.png; }

    # MultiViews equivalent: serve legend in browser's language
    location = /map-legend/openhikingmap-legend.html {
        default_type text/html;
        try_files /map-legend/openhikingmap-legend.html.$legend_lang
                  /map-legend/openhikingmap-legend.html.en
                  =404;
    }
    location = /map-legend/opentopomap-legend.html {
        default_type text/html;
        try_files /map-legend/opentopomap-legend.html.$legend_lang
                  /map-legend/opentopomap-legend.html.en
                  =404;
    }

    location /download/ {
        alias /home/big-data/mapnik-data/;
        autoindex on;
    }

    location ~ /\.git {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
